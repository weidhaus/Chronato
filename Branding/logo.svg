    .mark { color: #1E1F22 }
    @media (prefers-color-scheme: dark) { .mark { color: #C9CCD1 } }
  </style>
  <g class="mark" fill="currentColor">
    <path d="M48.17 23.61A18.5 18.5 0 1 0 48.17 47.39" fill="none" stroke="currentColor" stroke-width="7.5" stroke-linecap="round"/>
    <rect x="31.5" y="10.15" width="5" height="6.85"/>
    <rect x="26.5" y="5.15" width="15" height="5.5" rx="2.2"/>
  </g>
  <path d="M34 35.5 43.09 30.25" stroke="#E5533D" stroke-width="4" stroke-linecap="round"/>
  <circle cx="34" cy="35.5" r="3.9" fill="#E5533D"/>
</svg>
