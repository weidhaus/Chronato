<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Chronato">
  <!-- The C-stopwatch, flat. Same 64-unit geometry as scripts/make-icon.swift (y flipped).
       Graphite on light backgrounds, silver on dark; the hand is always tomato. -->
